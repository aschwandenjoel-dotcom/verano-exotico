<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710">
<rect width="800" height="710" fill="white"/>

<defs>
  <marker id="ah" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0,0 L 10,3 L 0,6 Z" fill="#CC2244"/>
  </marker>
  <marker id="ahs" viewBox="0 0 10 6" refX="1" refY="3" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 10,0 L 0,3 L 10,6 Z" fill="#CC2244"/>
  </marker>
</defs>

<!-- ======================== -->
<!-- LEFT PANTS - FRONT VIEW -->
<!-- ======================== -->

<!-- Waistband -->
<rect x="172" y="60" width="220" height="22" fill="white" stroke="black" stroke-width="2"/>

<!-- Belt loops front -->
<rect x="196" y="55" width="11" height="19" fill="white" stroke="black" stroke-width="1.3" rx="1"/>
<rect x="243" y="55" width="11" height="19" fill="white" stroke="black" stroke-width="1.3" rx="1"/>
<rect x="306" y="55" width="11" height="19" fill="white" stroke="black" stroke-width="1.3" rx="1"/>
<rect x="355" y="55" width="11" height="19" fill="white" stroke="black" stroke-width="1.3" rx="1"/>

<!-- Button at top center -->
<circle cx="282" cy="55" r="4.5" fill="white" stroke="black" stroke-width="1.5"/>

<!-- Fly (dashed) -->
<line x1="282" y1="82" x2="282" y2="155" stroke="black" stroke-width="1.5" stroke-dasharray="5,4"/>

<!-- Left pocket curve -->
<path d="M 172,82 C 188,83 208,94 224,124" fill="none" stroke="black" stroke-width="1.5"/>
<!-- Right pocket curve -->
<path d="M 392,82 C 376,83 356,94 340,124" fill="none" stroke="black" stroke-width="1.5"/>

<!-- Outer side seams -->
<line x1="172" y1="82" x2="172" y2="597" stroke="black" stroke-width="2"/>
<line x1="392" y1="82" x2="392" y2="597" stroke="black" stroke-width="2"/>

<!-- Crotch seam -->
<path d="M 172,192 L 270,192 Q 282,210 294,192 L 392,192" fill="none" stroke="black" stroke-width="2"/>

<!-- Left leg inner seam -->
<line x1="270" y1="192" x2="270" y2="597" stroke="black" stroke-width="2"/>
<!-- Right leg inner seam -->
<line x1="294" y1="192" x2="294" y2="597" stroke="black" stroke-width="2"/>

<!-- Left leg cuff -->
<line x1="172" y1="597" x2="172" y2="632" stroke="black" stroke-width="2"/>
<line x1="172" y1="597" x2="270" y2="597" stroke="black" stroke-width="2"/>
<line x1="172" y1="616" x2="270" y2="616" stroke="black" stroke-width="1.2"/>
<line x1="172" y1="632" x2="270" y2="632" stroke="black" stroke-width="2"/>
<line x1="270" y1="597" x2="270" y2="632" stroke="black" stroke-width="2"/>

<!-- Right leg cuff -->
<line x1="294" y1="597" x2="294" y2="632" stroke="black" stroke-width="2"/>
<line x1="294" y1="597" x2="392" y2="597" stroke="black" stroke-width="2"/>
<line x1="294" y1="616" x2="392" y2="616" stroke="black" stroke-width="1.2"/>
<line x1="294" y1="632" x2="392" y2="632" stroke="black" stroke-width="2"/>
<line x1="392" y1="597" x2="392" y2="632" stroke="black" stroke-width="2"/>

<!-- ========================= -->
<!-- RIGHT PANTS - BACK VIEW  -->
<!-- ========================= -->

<!-- Waistband -->
<rect x="490" y="60" width="220" height="22" fill="white" stroke="black" stroke-width="2"/>

<!-- Belt loops back -->
<rect x="514" y="55" width="11" height="19" fill="white" stroke="black" stroke-width="1.3" rx="1"/>
<rect x="675" y="55" width="11" height="19" fill="white" stroke="black" stroke-width="1.3" rx="1"/>

<!-- Outer side seams -->
<line x1="490" y1="82" x2="490" y2="597" stroke="black" stroke-width="2"/>
<line x1="710" y1="82" x2="710" y2="597" stroke="black" stroke-width="2"/>

<!-- Crotch seam back -->
<path d="M 490,192 L 586,192 Q 600,212 614,192 L 710,192" fill="none" stroke="black" stroke-width="2"/>

<!-- Left leg inner seam -->
<line x1="586" y1="192" x2="586" y2="597" stroke="black" stroke-width="2"/>
<!-- Right leg inner seam -->
<line x1="614" y1="192" x2="614" y2="597" stroke="black" stroke-width="2"/>

<!-- Left leg cuff -->
<line x1="490" y1="597" x2="490" y2="632" stroke="black" stroke-width="2"/>
<line x1="490" y1="597" x2="586" y2="597" stroke="black" stroke-width="2"/>
<line x1="490" y1="616" x2="586" y2="616" stroke="black" stroke-width="1.2"/>
<line x1="490" y1="632" x2="586" y2="632" stroke="black" stroke-width="2"/>
<line x1="586" y1="597" x2="586" y2="632" stroke="black" stroke-width="2"/>

<!-- Right leg cuff -->
<line x1="614" y1="597" x2="614" y2="632" stroke="black" stroke-width="2"/>
<line x1="614" y1="597" x2="710" y2="597" stroke="black" stroke-width="2"/>
<line x1="614" y1="616" x2="710" y2="616" stroke="black" stroke-width="1.2"/>
<line x1="614" y1="632" x2="710" y2="632" stroke="black" stroke-width="2"/>
<line x1="710" y1="597" x2="710" y2="632" stroke="black" stroke-width="2"/>

<!-- ======================== -->
<!--   MEASUREMENT ARROWS    -->
<!-- ======================== -->

<!-- Arrow 2: Hip width — full width of front pants at y=108 -->
<line x1="177" y1="108" x2="387" y2="108" stroke="#CC2244" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/>

<!-- Arrow 3: Thigh — half width (one leg) at y=154 -->
<line x1="177" y1="154" x2="265" y2="154" stroke="#CC2244" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/>

<!-- Arrow 4: Ankle — right leg at cuff level y=620 -->
<line x1="299" y1="620" x2="387" y2="620" stroke="#CC2244" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/>

<!-- Arrow 5: Front rise — vertical center, crotch up to waistband -->
<line x1="288" y1="188" x2="288" y2="87" stroke="#CC2244" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/>

<!-- Arrow 6: Back rise — vertical on back pants -->
<line x1="600" y1="65" x2="600" y2="186" stroke="#CC2244" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/>

<!-- Arrow 7: Inseam — tall vertical between the two views, with tick marks -->
<line x1="447" y1="197" x2="447" y2="592" stroke="#CC2244" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/>
<line x1="440" y1="197" x2="454" y2="197" stroke="#CC2244" stroke-width="1.6"/>
<line x1="440" y1="592" x2="454" y2="592" stroke="#CC2244" stroke-width="1.6"/>

<!-- Arrow 8: Full length — far left, full height with tick marks -->
<line x1="115" y1="65" x2="115" y2="627" stroke="#CC2244" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/>
<line x1="108" y1="65" x2="122" y2="65" stroke="#CC2244" stroke-width="1.6"/>
<line x1="108" y1="627" x2="122" y2="627" stroke="#CC2244" stroke-width="1.6"/>

<!-- ======================== -->
<!--      NUMBER CIRCLES      -->
<!-- ======================== -->

<!-- 2: Hip -->
<circle cx="224" cy="119" r="17" fill="#1A1A1A"/>
<text x="224" y="124" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">2</text>

<!-- 3: Thigh -->
<circle cx="210" cy="154" r="17" fill="#1A1A1A"/>
<text x="210" y="159" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">3</text>

<!-- 4: Ankle -->
<circle cx="340" cy="650" r="17" fill="#1A1A1A"/>
<text x="340" y="655" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">4</text>

<!-- 5: Front rise -->
<circle cx="322" cy="140" r="17" fill="#1A1A1A"/>
<text x="322" y="145" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">5</text>

<!-- 6: Back rise -->
<circle cx="650" cy="130" r="17" fill="#1A1A1A"/>
<text x="650" y="135" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">6</text>

<!-- 7: Inseam -->
<circle cx="447" cy="395" r="17" fill="#1A1A1A"/>
<text x="447" y="400" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">7</text>

<!-- 8: Full length -->
<circle cx="78" cy="346" r="17" fill="#1A1A1A"/>
<text x="78" y="351" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">8</text>

</svg>
